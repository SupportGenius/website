<!DOCTYPE html>
<!-- Source for assets/org-avatar.png (512×512), the GitHub organisation avatar.
     GitHub crops avatars to a rounded square or a circle, so the mark sits well inside. -->
<html lang="en"><head><meta charset="utf-8">
<style>
  html, body { margin: 0; width: 512px; height: 512px; overflow: hidden; background: #0a0c10; }
  .a { width: 512px; height: 512px; display: grid; place-items: center;
       background: radial-gradient(60% 60% at 50% 45%, rgba(91,157,255,.22), transparent 70%), #0a0c10; }
  svg { width: 300px; height: 300px; filter: drop-shadow(0 0 40px rgba(91,157,255,.55)); }
</style></head><body>
<div class="a">
<svg viewBox="0 0 32 32" aria-hidden="true"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7fb4ff"/><stop offset="1" stop-color="#3f7fe6"/></linearGradient></defs><rect width="32" height="32" rx="9" fill="url(#g)"/><circle cx="16" cy="16" r="10.2" fill="none" stroke="#0a0c10" stroke-opacity=".6" stroke-width="2" pathLength="64" stroke-dasharray="3 2.33 3 2.33 3 2.33 3 2.33 3 2.33 3 2.33 3 2.33 3 2.33 3 2.33 0 16" transform="rotate(-45 16 16)"/><circle cx="16" cy="16" r="5.6" fill="none" stroke="#0a0c10" stroke-opacity=".45" stroke-width="2" pathLength="100" stroke-dasharray="75 25" transform="rotate(135 16 16)"/><circle cx="16" cy="16" r="3" fill="#0a0c10"/></svg>
</div>
</body></html>
